# Context Capsule — Slack app manifest.
#
# Read-only by construction. There are zero write scopes anywhere here. If you
# fork this and add a write scope, the rest of the codebase will still refuse
# to call any write API, but you'll have weakened the trust story.
#
# Install from manifest: https://api.slack.com/reference/manifests
display_information:
  name: Context Capsule
  description: Curate Slack messages into immutable capsules. Hand them to your AI coding agent — read-only, scoped, audited.
  background_color: "#5B4BE6"
  long_description: |
    Context Capsule lets you select exact Slack messages and bundle them into
    immutable, redacted capsules that your coding agent can read through an
    MCP server. The agent never holds your Slack token. Each dereference is
    audited. You can also revoke or set capsules to single-use.

features:
  bot_user:
    display_name: Context Capsule
    always_online: false

  # The Phase 1 selection mechanism — message overflow shortcut.
  shortcuts:
    - name: Add to capsule
      type: message
      callback_id: add_to_capsule
      description: Add this message to your active draft capsule

oauth_config:
  redirect_urls:
    # Replace with your deployed origin.
    - https://example.com/api/slack/oauth_redirect
  scopes:
    bot:
      - channels:history    # read messages from public channels the bot is in
      - groups:history      # read messages from private channels the bot is in
      - im:history          # read messages from DMs the bot is in
      - mpim:history        # read messages from group DMs the bot is in
      - channels:read       # list channels for context
      - users:read          # resolve author display names
      - commands            # required to register the message shortcut

settings:
  event_subscriptions:
    request_url: https://example.com/api/slack/events
    bot_events: []          # zero subscribed events — pure shortcut-driven ingest
  interactivity:
    is_enabled: true
    request_url: https://example.com/api/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
